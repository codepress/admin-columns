name: Coding Standards
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer run cs:install   # installs the isolated fixer under tools/php-cs-fixer
      - run: composer run cs:check      # dry-run + diff; non-zero exit fails the job
